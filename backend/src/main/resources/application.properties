# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/contextband_ai
spring.datasource.username=postgres
spring.datasource.password=karvy
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:contextband-ai-secret-key-for-hackathon-mvp-2024-do-not-use-in-production}
jwt.expiration-ms=86400000

# Learning Configuration
contextband.learning-rate=0.3

# Logging
logging.level.com.contextband.ai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
